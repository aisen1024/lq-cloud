server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: lq-cloud
  profiles:
    active: dev

# LingQue Cloud 控制台配置
lq:
  ip: 127.0.0.1
  port: 6379
  console:
    enabled: true
    port: 8080
    context-path: /
    security:
      username: admin
      password: admin123
      jwt-secret: lq-cloud-console-jwt-secret-key-2024
      jwt-expiration: 86400000  # 24小时
    session:
      timeout: 1800  # 30分钟
      max-concurrent: 100

# 日志配置
logging:
  level:
    cn.lingque.cloud: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always