spring.application.name=lq-admin
server.port=8080

# 认证配置
lq.admin.auth.enabled=true
lq.admin.auth.default-username=admin
lq.admin.auth.default-password=admin123
lq.admin.auth.token-validity=86400000

# Redis 配置（如果使用 Redis）
#spring.data.redis.host=localhost
#spring.data.redis.port=6379

# 日志配置
logging.level.com.paypay.lqadmin=INFO
logging.level.cn.lingque=DEBUG

# LingQue Framework 配置
lingque.config.enabled=true
lingque.register.enabled=true
lingque.bus.enabled=true
lingque.mq.enabled=true
